name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed to attach artifacts to a release on tag

jobs:
  test:
    name: Import & test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Godot version
        id: ver
        run: echo "version=$(cat .godot-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Cache Godot headless
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-headless-${{ steps.ver.outputs.version }}

      - name: Download Godot headless
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p ${{ runner.temp }}/godot
          cd ${{ runner.temp }}/godot
          V="${{ steps.ver.outputs.version }}"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -o godot.zip
          # Since Godot 4.0 there is no separate headless download; the standard
          # editor binary is run with --headless. Normalise its name to a stable path.
          mv Godot_v*_linux.x86_64 godot_headless || true
          chmod +x godot_headless

      - name: Import project resources
        run: |
          cd "$GITHUB_WORKSPACE"
          ${{ runner.temp }}/godot/godot_headless --headless --import --quit
        timeout-minutes: 10

      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE"
          ${{ runner.temp }}/godot/godot_headless --headless --script res://tests/run_tests.gd
        timeout-minutes: 5

  export:
    name: Export artifacts
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Read Godot version
        id: ver
        run: echo "version=$(cat .godot-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Cache Godot headless + templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-export-${{ steps.ver.outputs.version }}

      - name: Download Godot headless and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p ${{ runner.temp }}/godot
          cd ${{ runner.temp }}/godot
          V="${{ steps.ver.outputs.version }}"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -o godot.zip
          # Since Godot 4.0 there is no separate headless download; the standard
          # editor binary is run with --headless. Normalise its name to a stable path.
          mv Godot_v*_linux.x86_64 godot_headless || true
          chmod +x godot_headless
          # Export templates (.tpz is a zip containing a templates/ folder).
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -o templates.tpz
          # Godot's version string (and the templates folder it looks for) uses a
          # dot before "stable" (e.g. "4.7.2.stable"), while the release tag /
          # .godot-version uses a hyphen ("4.7.2-stable"). Convert here.
          V_TPL="${V/-stable/.stable}"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${V_TPL}"
          mkdir -p "$TPL_DIR"
          cp -r templates/* "$TPL_DIR/"

      - name: Import project resources
        run: |
          cd "$GITHUB_WORKSPACE"
          ${{ runner.temp }}/godot/godot_headless --headless --import --quit
        timeout-minutes: 10

      - name: Create build directories
        run: mkdir -p build/windows build/linux-arm64

      - name: Export Windows x86_64
        run: |
          cd "$GITHUB_WORKSPACE"
          ${{ runner.temp }}/godot/godot_headless --headless --export-release "Windows Desktop" --quit
        timeout-minutes: 15

      - name: Export Linux arm64
        run: |
          cd "$GITHUB_WORKSPACE"
          ${{ runner.temp }}/godot/godot_headless --headless --export-release "Linux arm64" --quit
        timeout-minutes: 15

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hen-grenade-builds
          path: |
            build/windows/
            build/linux-arm64/

      - name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/HenGrenade.exe
            build/windows/HenGrenade.pck
            build/linux-arm64/HenGrenade.arm64
            build/linux-arm64/HenGrenade.pck
